<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costo Software Hospital de Ñuble</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .main-cost {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .main-cost h2 {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 15px;
        }
        
        .main-cost .amount {
            font-size: 4em;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px 0;
        }
        
        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .comparison-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .comparison-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .comparison-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        .comparison-card h3 {
            color: #2c3e50;
            font-size: 1.2em;
            margin-bottom: 15px;
            min-height: 50px;
        }
        
        .comparison-value {
            font-size: 1em;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        
        .multiplier {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .multiplier-number {
            font-size: 3.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .multiplier-label {
            font-size: 1.2em;
            color: #555;
            text-align: left;
        }
        
        .cost-comparison {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .cost-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .cost-label {
            min-width: 100px;
            font-size: 0.9em;
            font-weight: 600;
            color: #555;
        }
        
        .cost-visual {
            flex: 1;
            height: 25px;
            background: #e0e0e0;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        
        .cost-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 1s ease;
        }
        
        .cost-percentage {
            font-size: 0.85em;
            color: #666;
            min-width: 50px;
            text-align: right;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .main-cost .amount {
                font-size: 2.5em;
            }
            
            .comparison-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Costo Software Hospital de Ñuble</h1>
            <p>¿En qué más se podría invertir este dinero?</p>
        </header>
        
        <div class="main-cost">
            <h2>Inversión Total en Software</h2>
            <div class="amount">$14.801.350.000</div>
            <p style="color: #7f8c8d; font-size: 1.1em;">Catorce mil ochocientos un millones trescientos cincuenta mil pesos</p>
        </div>
        
        <div class="comparison-grid" id="comparisonGrid">
            <!-- Cards will be generated here -->
        </div>
    </div>
    
    <script>
        const csvData = `Item,Valor,Total Posible,Unidad
Software Hospital de Ñuble,"$14,801,350,000",1,vez
CESFAM Grande,"$9,800,000,000",1.5,centros
CESFAM Standard,"$6,400,000,000",2.3,centros
Número de Cirugías,"$1,450,000",10208,cirugías
Déficit de Salud en Tarapacá,"$14,000,000,000",1,vez
Máquinas de MRI,"$1,500,000,000",10,máquinas
Costo Salud per cápita,"$11,205",1320959,pacientes`;

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',');
            return lines.slice(2).map(line => {
                const values = line.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g).map(v => v.replace(/^"|"$/g, ''));
                return {
                    item: values[0],
                    value: values[1],
                    valueNum: parseFloat(values[1].replace(/[$,]/g, '')),
                    quantity: parseFloat(values[2]),
                    unit: values[3] || 'unidades'
                };
            });
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('es-CL').format(Math.round(num));
        }

        function createComparisonCards() {
            const data = parseCSV(csvData);
            const grid = document.getElementById('comparisonGrid');
            const softwareCost = 14801350000; // Reference cost
            
            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'comparison-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                const displayQuantity = item.quantity > 100 
                    ? formatNumber(item.quantity)
                    : item.quantity.toFixed(1);
                
                // Calculate percentage of software cost
                const percentOfBudget = (item.valueNum / softwareCost) * 100;
                const totalCost = item.valueNum * item.quantity;
                const totalPercent = (totalCost / softwareCost) * 100;
                
                card.innerHTML = `
                    <h3>${item.item}</h3>
                    <div class="comparison-value">${item.value} c/u</div>
                    <div class="multiplier">
                        <div class="multiplier-number">${displayQuantity}</div>
                        <div class="multiplier-label">${item.unit}</div>
                    </div>
                    <div class="cost-comparison">
                        <div class="cost-bar">
                            <div class="cost-label">Costo unitario</div>
                            <div class="cost-visual">
                                <div class="cost-fill" style="width: ${Math.min(percentOfBudget, 100)}%"></div>
                            </div>
                            <div class="cost-percentage">${percentOfBudget.toFixed(1)}%</div>
                        </div>
                        <div class="cost-bar">
                            <div class="cost-label">Costo total</div>
                            <div class="cost-visual">
                                <div class="cost-fill" style="width: ${Math.min(totalPercent, 100)}%"></div>
                            </div>
                            <div class="cost-percentage">${totalPercent.toFixed(1)}%</div>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        createComparisonCards();
    </script>
</body>
</html>
